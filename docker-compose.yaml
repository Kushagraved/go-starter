name: go-starter

services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: go_starter
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d go_starter"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # LocalStack stands in for S3 and SQS, so there is no separate "local" code path
  # in the app — it talks to an AWS endpoint either way.
  #
  # Pinned to 3.8.1: the `latest` and `stable` tags are now Pro builds that refuse
  # to start without a LOCALSTACK_AUTH_TOKEN.
  localstack:
    image: localstack/localstack:3.8.1
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,sqs
    volumes:
      # Runs once LocalStack is ready: creates the bucket and queues.
      - ./scripts/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3api head-bucket --bucket go-starter-local || exit 1"]
      interval: 6s
      timeout: 10s
      retries: 20
      start_period: 20s

volumes:
  pgdata:
